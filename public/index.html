<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f4" />
    <meta name="description" content="Find a mentor who gets where you want to go." />
    <title>MentorshipMatch — Find your next step</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Workspace navigation">
        <a class="brand" href="#" aria-label="MentorshipMatch home">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="20" height="20" fill="rgba(255,255,255,.55)" stroke="#4b704e" stroke-width="2" /><rect x="11" y="11" width="20" height="20" fill="rgba(255,255,255,.55)" stroke="#4b704e" stroke-width="2" /><path d="M1 1 31 31" fill="none" stroke="#4b704e" stroke-width="2" /></svg>
          <span>mentorship<span class="brand-light">match</span></span>
        </a>
        <div class="workspace-label">YOUR SPACE</div>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-link active" data-view="discover"><span class="nav-icon" aria-hidden="true">⌕</span>Community</button>
          <button class="nav-link" data-view="sessions"><span class="nav-icon" aria-hidden="true">▣</span>My sessions <span class="nav-count" id="session-count">0</span></button>
          <button class="nav-link" data-view="messages"><span class="nav-icon" aria-hidden="true">▤</span>Messages<span class="notification-dot" aria-hidden="true"></span></button>
        </nav>
        <div class="workspace-label second-label">PERSONAL</div>
        <nav class="main-nav" aria-label="Personal navigation">
          <button class="nav-link" data-view="profile"><span class="nav-icon" aria-hidden="true">◉</span>My profile</button>
          <button class="nav-link" id="admin-nav-link" data-view="admin" hidden><span class="nav-icon" aria-hidden="true">⚙</span>Admin</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="sidebar-note">
            <div class="note-spark" aria-hidden="true">✳</div>
            <strong>Small steps add up.</strong>
            <p>One conversation can change your whole perspective.</p>
            <button class="note-link" data-view="discover">Find your person <span>↗</span></button>
          </div>
        </div>
      </aside>

      <main class="main-content" id="main-content" tabindex="-1">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
          <nav class="breadcrumb" aria-label="Breadcrumb"><span>Your space</span><span aria-hidden="true">/</span><strong id="crumb-label" aria-current="page">Discover mentors</strong></nav>
          <div class="topbar-actions">
            <div class="notification-menu-wrap">
              <button class="icon-button notification-button" aria-label="Notifications" id="notifications" aria-expanded="false" aria-controls="notification-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><i id="notification-indicator" hidden></i></button>
              <section class="notification-menu" id="notification-menu" aria-label="Notifications" hidden></section>
            </div>
            <span class="topbar-divider"></span>
            <button class="topbar-user" id="account-button" aria-haspopup="dialog" aria-controls="modal-root"><span class="avatar avatar-you" aria-hidden="true">YN</span><span class="topbar-user-copy"><span id="topbar-name">Your name</span><small id="account-role">Student account</small></span></button>
          </div>
        </header>
        <div id="view-container"></div>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-backdrop" id="modal-root" aria-hidden="true"></div>
    <div id="call-root"></div>
    <div id="auth-root" role="main" tabindex="-1"></div>
    <script src="site.js"></script>
  </body>
</html>
